name: Generate Announcement Image

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system fonts
        run: sudo apt-get install -y fonts-ubuntu fonts-liberation

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Generate announcement image
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python generate_announcement_image.py

      - name: Commit image
        run: |
          git config user.name  "Armenian Content Bot"
          git config user.email "bot@armenians.page"
          git add images/announcement_*.png
          git diff --staged --quiet || git commit -m "🎉 Image annonce stratégie"
          git push
