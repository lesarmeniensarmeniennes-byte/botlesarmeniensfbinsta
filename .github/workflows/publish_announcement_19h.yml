name: Publish Announcement at 19h

on:
  schedule:
    - cron: '0 17 22 5 *'   # 19h Paris (17h UTC) — aujourd'hui 22 mai
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Publish announcement to RSS
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME:  ${{ github.event.repository.name }}
        run: python publish_announcement.py

      - name: Commit and push
        run: |
          git config user.name  "Armenian Content Bot"
          git config user.email "bot@armenians.page"
          git add feed.xml
          git diff --staged --quiet || git commit -m "📢 Post d'annonce stratégie — 19h"
          git push
